appId: com.code.reviewer
productName: Code_Reviewer
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
extraResources:
  - from: native/build/Debug/CodeReviewerEngine.exe
    to: native/CodeReviewerEngine.exe
  - from: native/build/Debug/CodeReviewerEngine.bat
    to: native/CodeReviewerEngine.bat
  - from: native/build/Debug/CodeReviewerEngine.fallback.js
    to: native/CodeReviewerEngine.fallback.js
  - from: native/build/Debug/.fallback-mode
    to: native/.fallback-mode
win:
  target:
    - msi
msi:
  oneClick: false
  perMachine: true
  shortcutName: "Code Reviewer"
  createDesktopShortcut: false
  createStartMenuShortcut: false
